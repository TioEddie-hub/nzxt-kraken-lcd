<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NZXT Kraken 360 - Brutalist Industrial Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;900&family=JetBrains+Mono:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --cpu-color: #ff9100;
      --cpu-glow: rgba(255, 145, 0, 0.45);
      --gpu-color: #00f0ff;
      --gpu-glow: rgba(0, 240, 255, 0.45);
      --hazard-yellow: #ffd000;
      --text-dim: #707e94;
      --line-subtle: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'JetBrains Mono', 'Chakra Petch', monospace;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Resolução física do Kraken 360: 240x240 */
    .screen {
      width: 240px;
      height: 240px;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px 12px 14px;
    }

    /* ========================================================
       EFEITO MOTION 4: MARCAÇÕES INDUSTRIAIS E HAZARD STRIPES
       ======================================================== */
    /* Cantos técnicos de mira militar/industrial */
    .corner {
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: rgba(255, 255, 255, 0.25);
      pointer-events: none;
    }
    .corner-tl { top: 10px; left: 10px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .corner-tr { top: 10px; right: 10px; border-top: 1.5px solid; border-right: 1.5px solid; }
    .corner-bl { bottom: 10px; left: 10px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .corner-br { bottom: 10px; right: 10px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    /* Barra animada de advertência industrial (Hazard Stripes) */
    .hazard-stripe-bar {
      width: 100%;
      max-width: 195px;
      height: 4px;
      background: repeating-linear-gradient(
        -45deg,
        #000000,
        #000000 6px,
        var(--hazard-yellow) 6px,
        var(--hazard-yellow) 12px
      );
      background-size: 24px 24px;
      animation: hazardScroll 1.6s linear infinite;
      opacity: 0.85;
      margin: 1px 0;
    }

    @keyframes hazardScroll {
      0% { background-position: 0 0; }
      100% { background-position: 24px 0; }
    }

    /* Topo: Carimbo técnico brutalista */
    .header-tag {
      font-size: 7.5px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .badge-status {
      padding: 1px 4px;
      background: #00ff66;
      color: #000000;
      font-size: 6.5px;
      font-weight: 900;
      border-radius: 1px;
    }

    /* Blocos de Telemetria com Fontes Gigantes */
    .telemetry-block {
      width: 100%;
      max-width: 195px;
      display: flex;
      flex-direction: column;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: -2px;
    }

    .meta-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .meta-hw {
      font-size: 7.5px;
      font-weight: 800;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cpu-block .meta-label { color: var(--cpu-color); }
    .gpu-block .meta-label { color: var(--gpu-color); }

    /* Linha principal: Temperatura Gigante */
    .value-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
    }

    .huge-number {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 58px;
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -3px;
      font-variant-numeric: tabular-nums;
    }

    .huge-unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 900;
      margin-left: 2px;
      opacity: 0.8;
    }

    .cpu-block .huge-number,
    .cpu-block .huge-unit {
      color: var(--cpu-color);
      text-shadow: 0 0 18px var(--cpu-glow);
    }

    .gpu-block .huge-number,
    .gpu-block .huge-unit {
      color: var(--gpu-color);
      text-shadow: 0 0 18px var(--gpu-glow);
    }

    /* Indicador térmico brutalista (LEVEL: NOMINAL) */
    .thermal-stamp {
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 3px;
      text-transform: uppercase;
    }

    .stamp-value {
      color: #ffffff;
      font-weight: 900;
    }

    /* Divisor Central */
    .center-section {
      width: 100%;
      max-width: 195px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .center-label {
      font-size: 7px;
      font-weight: 800;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="screen">
    <!-- Cantos de Mira Técnica -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Topo: Identificação do Sistema -->
    <div class="header-tag">
      <span class="badge-status" id="badge-status">SYS//OK</span>
      <span>SECTOR.01 // THERMAL</span>
    </div>

    <!-- Bloco 1: CPU -->
    <div class="telemetry-block cpu-block">
      <div class="meta-row">
        <div class="meta-label">┌ CPU_TEMP</div>
        <div class="meta-hw" id="cpu-hw">RYZEN 5600X</div>
      </div>
      <div class="value-row">
        <div>
          <span id="cpu-temp" class="huge-number">--</span>
          <span class="huge-unit">°C</span>
        </div>
        <div class="thermal-stamp">
          LVL:<span id="cpu-lvl" class="stamp-value">NORMAL</span>
        </div>
      </div>
    </div>

    <!-- Divisor Central com Faixa Zebrada Animada (Hazard Stripes) -->
    <div class="center-section">
      <div class="hazard-stripe-bar"></div>
      <div class="center-label">── CRITICAL MONITORING ──</div>
    </div>

    <!-- Bloco 2: GPU -->
    <div class="telemetry-block gpu-block">
      <div class="meta-row">
        <div class="meta-label">┌ GPU_TEMP</div>
        <div class="meta-hw" id="gpu-hw">RX 9070 XT</div>
      </div>
      <div class="value-row">
        <div>
          <span id="gpu-temp" class="huge-number">--</span>
          <span class="huge-unit">°C</span>
        </div>
        <div class="thermal-stamp">
          LVL:<span id="gpu-lvl" class="stamp-value">NORMAL</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const elCpuTemp = document.getElementById('cpu-temp');
    const elCpuHw = document.getElementById('cpu-hw');
    const elCpuLvl = document.getElementById('cpu-lvl');
    const elGpuTemp = document.getElementById('gpu-temp');
    const elGpuHw = document.getElementById('gpu-hw');
    const elGpuLvl = document.getElementById('gpu-lvl');
    const elBadge = document.getElementById('badge-status');

    let camConnected = false;

    function getLevelText(temp) {
      if (temp < 55) return 'NORMAL';
      if (temp < 72) return 'ELEVATED';
      return 'CRIT';
    }

    function cleanName(name, fallback) {
      if (!name) return fallback;
      return name
        .replace(/(AMD|Intel|NVIDIA|GeForce|Processor|Graphics)/gi, '')
        .replace(/\(R\)|\(TM\)/gi, '')
        .replace(/\s+/g, ' ')
        .trim() || fallback;
    }

    function renderData(data) {
      if (!data) return;

      const cpu = data.cpus?.[0];
      if (cpu) {
        const temp = Math.round(cpu.temperature ?? 0);
        elCpuTemp.textContent = temp;
        elCpuLvl.textContent = getLevelText(temp);
        if (cpu.name) {
          elCpuHw.textContent = cleanName(cpu.name, 'CPU');
        }
      }

      const gpu = data.gpus?.[0];
      if (gpu) {
        const temp = Math.round(gpu.temperature ?? 0);
        elGpuTemp.textContent = temp;
        elGpuLvl.textContent = getLevelText(temp);
        if (gpu.name) {
          elGpuHw.textContent = cleanName(gpu.name, 'GPU');
        }
      }
    }

    // Integração oficial NZXT CAM
    window.nzxt = {
      v1: {
        onMonitoringDataUpdate: (data) => {
          if (!camConnected) {
            camConnected = true;
            elBadge.textContent = 'ONLINE';
          }
          renderData(data);
        }
      }
    };

    // Modo Mock para teste no Chrome desktop
    setTimeout(() => {
      if (!camConnected) {
        elBadge.textContent = 'MOCK';
        elCpuHw.textContent = '5600X';
        elGpuHw.textContent = '9070 XT';

        function mockCycle() {
          if (camConnected) return;
          renderData({
            cpus: [{ temperature: 48 + Math.floor(Math.random() * 5), name: '5600X' }],
            gpus: [{ temperature: 53 + Math.floor(Math.random() * 6), name: '9070 XT' }]
          });
        }

        mockCycle();
        setInterval(mockCycle, 1500);
      }
    }, 1200);
  </script>
</body>
</html>
