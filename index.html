<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NZXT Kraken 360 - Centered Waves Ultra Big</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;900&family=JetBrains+Mono:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --cpu-color: #ff7700;
      --cpu-glow: rgba(255, 119, 0, 0.45);
      --gpu-color: #00e5ff;
      --gpu-glow: rgba(0, 229, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Chakra Petch', -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container exato de 240x240 */
    .viewport {
      width: 240px;
      height: 240px;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ========================================================
       EFEITO MOTION: ONDULAÇÃO LÍQUIDA / WAVES NA BORDA
       Bordas orgânicas ondulantes em rotação com pulso fluido
       ======================================================== */
    .waves-container {
      position: absolute;
      width: 240px;
      height: 240px;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    /* Onda 1: Ciano fluido com deformação senoidal */
    .wave-ring-1 {
      position: absolute;
      width: 228px;
      height: 228px;
      border-radius: 48% 52% 51% 49% / 51% 49% 52% 48%;
      border: 1.5px solid rgba(0, 229, 255, 0.45);
      box-shadow: 
        0 0 10px rgba(0, 229, 255, 0.3),
        inset 0 0 10px rgba(0, 229, 255, 0.15);
      animation: waveMorph 7s ease-in-out infinite alternate, waveRotate 14s linear infinite;
    }

    /* Onda 2: Laranja térmico fluido em sentido contrário */
    .wave-ring-2 {
      position: absolute;
      width: 234px;
      height: 234px;
      border-radius: 52% 48% 49% 51% / 49% 51% 48% 52%;
      border: 1.5px solid rgba(255, 119, 0, 0.35);
      box-shadow: 
        0 0 12px rgba(255, 119, 0, 0.25),
        inset 0 0 8px rgba(255, 119, 0, 0.1);
      animation: waveMorph 5s ease-in-out infinite alternate-reverse, waveRotateReverse 18s linear infinite;
    }

    /* Onda 3: Ripple de pulso expansivo */
    .ripple-wave {
      position: absolute;
      width: 206px;
      height: 206px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      animation: ripplePulse 3.2s cubic-bezier(0.1, 0.7, 0.3, 1) infinite;
    }

    .ripple-wave-2 {
      position: absolute;
      width: 206px;
      height: 206px;
      border-radius: 50%;
      border: 1px solid rgba(0, 229, 255, 0.35);
      animation: ripplePulse 3.2s cubic-bezier(0.1, 0.7, 0.3, 1) infinite 1.6s;
    }

    @keyframes waveMorph {
      0% { border-radius: 48% 52% 51% 49% / 51% 49% 52% 48%; }
      33% { border-radius: 53% 47% 54% 46% / 47% 53% 46% 54%; }
      66% { border-radius: 46% 54% 48% 52% / 54% 46% 52% 48%; }
      100% { border-radius: 51% 49% 52% 48% / 49% 51% 48% 52%; }
    }

    @keyframes waveRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes waveRotateReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes ripplePulse {
      0% { transform: scale(0.92); opacity: 0.8; }
      100% { transform: scale(1.14); opacity: 0; }
    }

    /* ========================================================
       CONTEÚDO CENTRALIZADO COM NÚMEROS GIGANTES (CPU & GPU)
       ======================================================== */
    .telemetry-stack {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
      padding: 8px 0;
      gap: 4px;
    }

    .block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 1px;
    }

    .cpu-block .label {
      color: var(--cpu-color);
      text-shadow: 0 0 10px var(--cpu-glow);
    }

    .gpu-block .label {
      color: var(--gpu-color);
      text-shadow: 0 0 10px var(--gpu-glow);
    }

    .huge-temp-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      line-height: 0.82;
    }

    /* Números ampliados para 68px de altura */
    .huge-number {
      font-size: 68px;
      font-weight: 900;
      letter-spacing: -3px;
      font-variant-numeric: tabular-nums;
    }

    .huge-deg {
      font-size: 26px;
      font-weight: 800;
      margin-left: 2px;
      opacity: 0.85;
      font-family: 'JetBrains Mono', monospace;
    }

    .cpu-block .huge-number,
    .cpu-block .huge-deg {
      color: var(--cpu-color);
      text-shadow: 0 0 24px var(--cpu-glow);
    }

    .gpu-block .huge-number,
    .gpu-block .huge-deg {
      color: var(--gpu-color);
      text-shadow: 0 0 24px var(--gpu-glow);
    }

    /* Linha divisória minimalista */
    .center-line {
      width: 110px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      margin: 2px 0;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <!-- Efeito Motion: Ondas Líquidas e Ripples na Borda -->
    <div class="waves-container">
      <div class="wave-ring-1"></div>
      <div class="wave-ring-2"></div>
      <div class="ripple-wave"></div>
      <div class="ripple-wave-2"></div>
    </div>

    <!-- Telemetria Centralizada: Apenas CPU e GPU com Números Gigantes -->
    <div class="telemetry-stack">
      <!-- Bloco Topo: CPU -->
      <div class="block cpu-block">
        <div class="label">CPU</div>
        <div class="huge-temp-row">
          <span id="cpu-temp" class="huge-number">--</span>
          <span class="huge-deg">°</span>
        </div>
      </div>

      <!-- Divisor -->
      <div class="center-line"></div>

      <!-- Bloco Fundo: GPU -->
      <div class="block gpu-block">
        <div class="label">GPU</div>
        <div class="huge-temp-row">
          <span id="gpu-temp" class="huge-number">--</span>
          <span class="huge-deg">°</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const elCpuTemp = document.getElementById('cpu-temp');
    const elGpuTemp = document.getElementById('gpu-temp');

    let camConnected = false;

    function renderData(data) {
      if (!data) return;

      const cpu = data.cpus?.[0];
      if (cpu && cpu.temperature !== undefined) {
        elCpuTemp.textContent = Math.round(cpu.temperature);
      }

      const gpu = data.gpus?.[0];
      if (gpu && gpu.temperature !== undefined) {
        elGpuTemp.textContent = Math.round(gpu.temperature);
      }
    }

    // Integração oficial NZXT CAM
    window.nzxt = {
      v1: {
        onMonitoringDataUpdate: (data) => {
          camConnected = true;
          renderData(data);
        }
      }
    };

    // Modo Mock
    setTimeout(() => {
      if (!camConnected) {
        function mockCycle() {
          if (camConnected) return;
          renderData({
            cpus: [{ temperature: 48 + Math.floor(Math.random() * 5) }],
            gpus: [{ temperature: 53 + Math.floor(Math.random() * 6) }]
          });
        }

        mockCycle();
        setInterval(mockCycle, 1500);
      }
    }, 1200);
  </script>
</body>
</html>
