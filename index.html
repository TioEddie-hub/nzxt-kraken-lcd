<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NZXT Dual Bars - Native Proportions Fluid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --track-bg: #444955;
      --cpu-from: #00ff66;
      --cpu-to: #00ffcc;
      --cpu-glow: rgba(0, 255, 120, 0.4);
      --gpu-from: #ff0055;
      --gpu-to: #ff3377;
      --gpu-glow: rgba(255, 0, 85, 0.4);
      --text-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tela física 240x240 */
    .viewport {
      width: 240px;
      height: 240px;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container com a proporção exata do preset nativo NZXT */
    .hud-box {
      width: 178px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Módulo individual (CPU no topo, GPU na base) */
    .module {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Lado Esquerdo: Barra + Rótulo */
    .bar-side {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--text-white);
      text-transform: uppercase;
      line-height: 1;
      padding-left: 1px;
    }

    .cpu-module .label {
      margin-bottom: 5px;
    }

    .gpu-module .label {
      margin-top: 5px;
    }

    /* Trilho da barra em formato cápsula (Pill shape) */
    .bar-track {
      width: 100%;
      height: 11px;
      background-color: var(--track-bg);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }

    /* Preenchimento Fluido com Gradiente */
    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      background-size: 200% 100%;
    }

    /* Barra CPU */
    .cpu-fill {
      background-image: linear-gradient(90deg, var(--cpu-from), var(--cpu-to), var(--cpu-from));
      box-shadow: 0 0 10px var(--cpu-glow);
      animation: fluidShimmer 3.5s ease-in-out infinite;
    }

    /* Barra GPU */
    .gpu-fill {
      background-image: linear-gradient(90deg, var(--gpu-from), var(--gpu-to), var(--gpu-from));
      box-shadow: 0 0 10px var(--gpu-glow);
      animation: fluidShimmer 3.5s ease-in-out infinite 1.7s;
    }

    @keyframes fluidShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Lado Direito: Número Gigante alinhado à barra */
    .num-side {
      display: flex;
      align-items: flex-start;
      line-height: 0.82;
      min-width: 68px;
      justify-content: flex-end;
    }

    /* Número ampliado para 48px (~35% maior que o nativo da NZXT, ideal para distância) */
    .temp-val {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--text-white);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }

    .temp-deg {
      font-size: 15px;
      font-weight: 800;
      margin-top: 3px;
      margin-left: 2px;
      color: var(--text-white);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="hud-box">
      <!-- Módulo Superior: CPU -->
      <div class="module cpu-module">
        <div class="bar-side">
          <span class="label">CPU</span>
          <div class="bar-track">
            <div id="cpu-fill" class="bar-fill cpu-fill"></div>
          </div>
        </div>
        <div class="num-side">
          <span id="cpu-num" class="temp-val">--</span>
          <span class="temp-deg">°</span>
        </div>
      </div>

      <!-- Módulo Inferior: GPU -->
      <div class="module gpu-module">
        <div class="bar-side">
          <div class="bar-track">
            <div id="gpu-fill" class="bar-fill gpu-fill"></div>
          </div>
          <span class="label">GPU</span>
        </div>
        <div class="num-side">
          <span id="gpu-num" class="temp-val">--</span>
          <span class="temp-deg">°</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const elCpuNum = document.getElementById('cpu-num');
    const elGpuNum = document.getElementById('gpu-num');
    const elCpuFill = document.getElementById('cpu-fill');
    const elGpuFill = document.getElementById('gpu-fill');

    let camConnected = false;

    // Escala de temperatura nas barras: 25°C a 85°C
    function calcRatio(temp) {
      const min = 25;
      const max = 85;
      const clamped = Math.max(min, Math.min(max, temp));
      return ((clamped - min) / (max - min)) * 100;
    }

    function renderData(data) {
      if (!data) return;

      const cpu = data.cpus?.[0];
      if (cpu && cpu.temperature !== undefined) {
        const temp = Math.round(cpu.temperature);
        elCpuNum.textContent = temp;
        elCpuFill.style.width = `${calcRatio(temp)}%`;
      }

      const gpu = data.gpus?.[0];
      if (gpu && gpu.temperature !== undefined) {
        const temp = Math.round(gpu.temperature);
        elGpuNum.textContent = temp;
        elGpuFill.style.width = `${calcRatio(temp)}%`;
      }
    }

    // Integração oficial NZXT CAM
    window.nzxt = {
      v1: {
        onMonitoringDataUpdate: (data) => {
          camConnected = true;
          renderData(data);
        }
      }
    };

    // Modo Mock para testes locais
    setTimeout(() => {
      if (!camConnected) {
        function mockCycle() {
          if (camConnected) return;
          renderData({
            cpus: [{ temperature: 40 + Math.floor(Math.random() * 4) }],
            gpus: [{ temperature: 56 + Math.floor(Math.random() * 4) }]
          });
        }

        mockCycle();
        setInterval(mockCycle, 1500);
      }
    }, 1200);
  </script>
</body>
</html>
