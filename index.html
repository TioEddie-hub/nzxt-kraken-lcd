<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NZXT Dual Bars - Full Width Fluid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --track-bg: #323742;
      --cpu-from: #00ff66;
      --cpu-to: #00ffcc;
      --cpu-glow: rgba(0, 255, 120, 0.4);
      --gpu-from: #ff0055;
      --gpu-to: #ff3377;
      --gpu-glow: rgba(255, 0, 85, 0.4);
      --text-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tela física 240x240 */
    .viewport {
      width: 240px;
      height: 240px;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Container central alinhado exatamente ao print de referência */
    .hud-container {
      width: 196px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Linhas de Informação (Acima da barra da CPU e Abaixo da barra da GPU) */
    .info-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 4px;
    }

    .info-row.bottom-row {
      align-items: flex-start;
      margin-top: -2px;
    }

    .info-row.top-row {
      margin-bottom: -2px;
    }

    /* Rótulos CPU / GPU */
    .label {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-white);
      text-transform: uppercase;
      line-height: 1;
    }

    .top-row .label {
      margin-bottom: 8px;
    }

    .bottom-row .label {
      margin-top: 8px;
    }

    /* Números GIGANTES ampliados para 64px */
    .temp-group {
      display: flex;
      align-items: flex-start;
      line-height: 0.82;
    }

    .temp-number {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -3px;
      color: var(--text-white);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.25);
    }

    .temp-deg {
      font-size: 20px;
      font-weight: 800;
      margin-top: 3px;
      margin-left: 2px;
      color: var(--text-white);
      opacity: 0.9;
    }

    /* Trilho da Barra (Início ao Fim da largura útil) */
    .bar-track {
      width: 100%;
      height: 12px;
      background-color: var(--track-bg);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      margin: 2px 0;
    }

    /* Preenchimento Fluido com Gradiente Animado */
    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      background-size: 200% 100%;
    }

    /* Barra CPU: Verde Neon Fluido */
    .cpu-fill {
      background-image: linear-gradient(90deg, var(--cpu-from), var(--cpu-to), var(--cpu-from));
      box-shadow: 0 0 12px var(--cpu-glow);
      animation: fluidShimmer 3.5s ease-in-out infinite;
    }

    /* Barra GPU: Magenta/Rosa Fluido */
    .gpu-fill {
      background-image: linear-gradient(90deg, var(--gpu-from), var(--gpu-to), var(--gpu-from));
      box-shadow: 0 0 12px var(--gpu-glow);
      animation: fluidShimmer 3.5s ease-in-out infinite 1.7s;
    }

    /* Shimmer líquido suave no interior da barra */
    @keyframes fluidShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="hud-container">
      <!-- Linha Superior (Acima da Barra da CPU): Rótulo CPU à esquerda e Número Gigante à direita -->
      <div class="info-row top-row">
        <span class="label">CPU</span>
        <div class="temp-group">
          <span id="cpu-num" class="temp-number">--</span>
          <span class="temp-deg">°</span>
        </div>
      </div>

      <!-- Barra da CPU de Ponta a Ponta -->
      <div class="bar-track">
        <div id="cpu-fill" class="bar-fill cpu-fill"></div>
      </div>

      <!-- Barra da GPU de Ponta a Ponta -->
      <div class="bar-track">
        <div id="gpu-fill" class="bar-fill gpu-fill"></div>
      </div>

      <!-- Linha Inferior (Abaixo da Barra da GPU): Rótulo GPU à esquerda e Número Gigante à direita -->
      <div class="info-row bottom-row">
        <span class="label">GPU</span>
        <div class="temp-group">
          <span id="gpu-num" class="temp-number">--</span>
          <span class="temp-deg">°</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const elCpuNum = document.getElementById('cpu-num');
    const elGpuNum = document.getElementById('gpu-num');
    const elCpuFill = document.getElementById('cpu-fill');
    const elGpuFill = document.getElementById('gpu-fill');

    let camConnected = false;

    // Escala de temperatura nas barras: 25°C a 85°C
    function calcRatio(temp) {
      const min = 25;
      const max = 85;
      const clamped = Math.max(min, Math.min(max, temp));
      return ((clamped - min) / (max - min)) * 100;
    }

    function renderData(data) {
      if (!data) return;

      const cpu = data.cpus?.[0];
      if (cpu && cpu.temperature !== undefined) {
        const temp = Math.round(cpu.temperature);
        elCpuNum.textContent = temp;
        elCpuFill.style.width = `${calcRatio(temp)}%`;
      }

      const gpu = data.gpus?.[0];
      if (gpu && gpu.temperature !== undefined) {
        const temp = Math.round(gpu.temperature);
        elGpuNum.textContent = temp;
        elGpuFill.style.width = `${calcRatio(temp)}%`;
      }
    }

    // Integração oficial NZXT CAM
    window.nzxt = {
      v1: {
        onMonitoringDataUpdate: (data) => {
          camConnected = true;
          renderData(data);
        }
      }
    };

    // Modo Mock para testes locais
    setTimeout(() => {
      if (!camConnected) {
        function mockCycle() {
          if (camConnected) return;
          renderData({
            cpus: [{ temperature: 48 + Math.floor(Math.random() * 5) }],
            gpus: [{ temperature: 53 + Math.floor(Math.random() * 6) }]
          });
        }

        mockCycle();
        setInterval(mockCycle, 1500);
      }
    }, 1200);
  </script>
</body>
</html>
